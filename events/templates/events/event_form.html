{% extends 'base.html' %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <h4>Ticket Types</h4>
    {{ formset.management_form }}
    {% for tf in formset %}
        <div class="border p-3 mb-2">
            {{ tf.as_p }}
        </div>
    {% endfor %}

    <button class="btn btn-primary" type="submit">Save</button>
</form>
{% endblock %}
